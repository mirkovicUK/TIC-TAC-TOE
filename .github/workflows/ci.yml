name: CI

# Requirement 12.9: every push and every pull request runs the test suite, the
# static analysis and the formatting check, and reports failure if any of them
# fails. No step carries `continue-on-error`, so any red step is a red workflow.
on:
  push:
  pull_request:

# The workflow default, and what `quality` and `browser` get: read the repository and
# nothing else. `publish` raises `packages: write` for GHCR and `deploy` raises
# `id-token: write` to mint the OIDC token AWS trades for a role. Both are declared on
# the job rather than here, so the two test jobs cannot publish an image or obtain an
# AWS credential.
permissions:
  contents: read

jobs:
  # Two jobs, `quality` and `browser`, with `browser` gated behind this one.
  #
  # The split is not about wall-clock time, and measuring says so: locally the whole
  # suite in one command is 19.5s, of which the browser test is about 7s and the
  # exhaustive enumeration alone is 10.1s. Splitting wins no time at all — on a runner
  # it costs time, because each job starts from an empty VM and pays checkout, PHP with
  # ten extensions, `composer install`, `npm ci` and `npm run build` over again.
  #
  # What it buys is which signal a red tick carries. Browser automation is the flakiest
  # thing in any pipeline, and if a flake and a real regression both surface as one red
  # tick on one job, the tick stops meaning anything — at which point nobody
  # investigates a red build, and that is the actual failure rather than the flake.
  # Split, the location of the red is information before a log is opened: `browser` red
  # with `quality` green reads as "the automation wobbled", `quality` red reads as
  # "something is broken". The `--exclude-group=browser` below is what keeps the two
  # ticks disjoint; running the whole suite in both jobs would undo the split while
  # appearing to keep it.
  #
  # Nothing is duplicated beyond the setup both jobs need. `composer lint`,
  # `composer analyse` and `npx tsc --noEmit` belong to this job only — running them
  # twice doubles their cost and adds no signal.
  quality:
    name: quality
    runs-on: ubuntu-24.04

    steps:
      # Third-party actions are pinned to a commit, not a floating tag: a moving
      # `@v7` is a write to this workflow by someone outside the repository.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PHP is pinned to 8.5, the version the project is developed and deployed
      # on (`php:8.5-fpm` in the Dockerfile). Coverage is off — nothing here
      # reads a coverage report, and Xdebug would roughly triple the enumeration.
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, xml, curl, intl, bcmath, fileinfo, tokenizer, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Resolve the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.5-

      # Before `composer install`, because its `post-autoload-dump` hook runs
      # `artisan package:discover`, and giving that an `.env` to read is one less
      # way for the install step to be the first thing that boots the framework
      # without one. `.env` itself is gitignored, so CI always starts from the
      # example.
      - name: Create the environment file
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # `phpunit.xml` already pins the test database to sqlite `:memory:` and the
      # session, cache and queue drivers to non-persistent ones, so no database
      # file is created and no migration is run here — the suite builds its schema
      # in memory, and those settings win over `.env` because variables already
      # present in the environment are not overwritten. What `phpunit.xml` does
      # not supply is `APP_KEY`, which the encrypter needs before the application
      # will boot, so a throwaway key is generated per run. No real secret is
      # committed or needed.
      - name: Generate a throwaway application key
        run: php artisan key:generate

      # Formatting first, then static analysis: both are seconds, and finding a
      # style or type error should not wait on a Node install or the enumeration.
      - name: Check formatting (pint --test)
        run: composer lint

      # Both tiers: level 8 over app/, database/ and tests/, then level max over
      # the domain. `composer analyse` runs them in that order and stops on the
      # first failure.
      - name: Run static analysis
        run: composer analyse

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: npm ci

      # Vite transpiles with esbuild, which strips types without checking them,
      # so `npm run build` succeeding says nothing about type soundness. This is
      # the only step that checks the props contract between GameRepresentation
      # and GameProps holds.
      - name: Type-check the client
        run: npx tsc --noEmit

      # The front-end build is not decoration in this job. `resources/views/app.blade.php`
      # carries `@vite(...)`, so any feature test that renders the root view
      # throws "Vite manifest not found" without `public/build/manifest.json`,
      # which is gitignored. Verified by removing the manifest locally: the
      # feature test fails. Assets are therefore built before the suite runs.
      - name: Build front-end assets
        run: npm run build

      # Excludes the `browser` group, which the `browser` job below runs. The
      # exhaustive enumeration (549,946 nodes, Req 14.2) stays in this job and is
      # NOT split out: it measures 9.8s of a 10.4s suite locally on PHP 8.5,
      # comfortably inside the design's 60s budget, so mitigation 3 in the design's
      # runtime-budget list is not taken.
      - name: Run the test suite (excluding the browser group)
        run: vendor/bin/pest --exclude-group=browser

  # One end-to-end browser test, and one on purpose (ADR-008): Requirement 14.5 asks
  # for a single test driving two Player_Sessions to a Terminal_State, browser
  # automation is the slowest and least reliable part of any pipeline, and a second
  # test would buy coverage the feature suite already has at a cost paid on every push.
  # `PlayAGameTest` is the whole selection, which is why `--group=browser` is a
  # one-test run rather than a suite.
  #
  # The step that is not self-explanatory is `npx playwright install`. `playwright` is
  # a pinned devDependency, so `npm ci` writes the package into `node_modules` — but
  # the package ships no install hook (its `scripts` block is empty) and the browser
  # binaries live outside the project, under `~/.cache/ms-playwright`. Skip that step
  # and the test fails launching chromium, not on an assertion.
  #
  # `needs: quality`, and the tradeoff is real rather than one-sided — an earlier
  # version of this file left it out and justified that by saying serialising would not
  # protect the signal, which was true and beside the point. `needs:` costs nothing in
  # signal: a red tick here still reads as a browser problem and a red tick there as a
  # domain problem, whichever order they run in. What it actually trades is runner time
  # against feedback latency.
  #
  # Gating is the better side of that trade here. This job is the expensive one — it
  # downloads chromium and apt-installs its shared libraries on a cold cache — and
  # spending that on a push whose static analysis or unit tests have already failed buys
  # nothing, because the push is going to be fixed and pushed again regardless. The cost
  # is that browser feedback now arrives after `quality` finishes instead of beside it,
  # which matters only for a push that is otherwise green, and for those the wait is the
  # length of one `quality` run.
  browser:
    name: browser
    runs-on: ubuntu-24.04
    needs: quality

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same PHP as `quality` and as the Dockerfile: the browser test drives the real
      # application through the plugin's in-process HTTP server, so it needs the same
      # extensions the feature suite does — sqlite included, since the test selects the
      # `database` session driver and `RefreshDatabase` builds that schema in memory.
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, xml, curl, intl, bcmath, fileinfo, tokenizer, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Resolve the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # Deliberately the same keys as `quality` uses: the two jobs want the same
      # downloads, and a shared entry is the point. Whichever job finishes second
      # finds the key already written and logs a warning; a cache save is not a step
      # failure, so the workflow is unaffected.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.5-

      - name: Create the environment file
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate a throwaway application key
        run: php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: npm ci

      # `resources/views/app.blade.php` carries `@vite(...)` and `public/build/manifest.json`
      # is gitignored, so the pages this test drives do not render without a build. Not
      # optional decoration: without it the first `visit('/')` gets "Vite manifest not found".
      - name: Build front-end assets
        run: npm run build

      # Read the version out of the installed package rather than restating `1.62.1`
      # here. A literal in this file is a second place to remember on a version bump,
      # and a stale one would restore chromium for the wrong version — which
      # `playwright install` then silently re-downloads, making the cache a no-op that
      # still reports a hit. Keying on `package-lock.json` instead would work, but it
      # discards the whole browser cache whenever any unrelated dependency moves.
      - name: Resolve the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # No `restore-keys`: a near-miss restore is worse than a miss here, because the
      # binaries for another version are dead weight that never gets used.
      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Runs on a cache hit too, and must. The cache covers `~/.cache/ms-playwright`,
      # the browser binaries; `--with-deps` also installs the apt packages chromium
      # links against, which live in system paths no cache here restores. On a hit this
      # step finds the binaries present and skips the download, so what it costs is the
      # apt work alone — which is the part that cannot be skipped.
      - name: Install the chromium browser and its OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run the browser test
        run: vendor/bin/pest --group=browser

  # Builds and pushes the Image_Pair to GHCR, tagged by the full commit SHA.
  #
  # `needs: browser` puts it behind both test jobs, so the registry never holds a tag the
  # suite has not passed. `github.ref` is `refs/pull/N/merge` on a pull request and
  # `refs/heads/<name>` on any other branch, so the one condition covers Requirement 1.4
  # without a second check: nothing publishes from a fork, a branch or a PR.
  publish:
    name: publish
    runs-on: ubuntu-24.04
    needs: browser
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Required, not decoration: the default docker driver supports neither
      # `cache-to: type=gha` nor building a named `target`, and this file needs both.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # `GITHUB_TOKEN` is the run's own ephemeral token, scoped by the `packages: write`
      # above. No registry credential is stored in this repository or on the instance —
      # the instance pulls anonymously, which is why both packages must be public.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One step per target, `app` first because the `web` stage copies `public/` out of
      # it — so the shared cache scope below is what stops that stage being built twice.
      #
      # Lowercase repository path, hardcoded. The repository is `mirkovicUK/TIC-TAC-TOE`
      # and GHCR refuses an uppercase reference, so `github.repository_owner` cannot be
      # interpolated here without lowercasing it first.
      #
      # The SHA is the only tag. No `latest`: a moving tag makes "what is deployed"
      # unanswerable, and `compose.yaml` resolves `${RELEASE_TAG:?…}` precisely so that an
      # unset variable fails instead of silently landing on whatever `latest` points at.
      #
      # `linux/amd64` alone. The instance is a t3.micro, x86_64; a second platform would
      # roughly double the build for an image nothing else runs.
      #
      # `org.opencontainers.image.revision` is set here and must be: the deploy document
      # reads it back off the running container and exits 67 if it disagrees with the tag
      # it was asked to deploy. That check is only worth anything because the label comes
      # from the build rather than from the deployment environment.
      #
      # `provenance: false` keeps the push a plain single-platform manifest. Attestations
      # would make each tag an OCI index of image plus attestation, which nothing here
      # verifies, and the extra indirection is one more thing between a tag and the labels
      # the deploy asserts against.
      - name: Build and push the app image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: app
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/mirkovicuk/tic-tac-toe-app:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=tic-tac-toe
          cache-to: type=gha,mode=max,scope=tic-tac-toe

      # Same scope as the step above, and `mode=max` there is what makes it useful:
      # mode=min would export only the final `app` layers, so this build would repeat
      # Composer and the Vite build to reach the stage it copies from.
      - name: Build and push the web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: web
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/mirkovicuk/tic-tac-toe-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=tic-tac-toe
          cache-to: type=gha,mode=max,scope=tic-tac-toe

      # Both references, so step 7 of docs/cd.md has the exact tag to test a public pull
      # against, and so the deploy job's `ReleaseTag` is visible in the run that produced
      # the images rather than only in the one that consumes them.
      - name: Report what was published
        run: |
          echo "app: ghcr.io/mirkovicuk/tic-tac-toe-app:${{ github.sha }}"
          echo "web: ghcr.io/mirkovicuk/tic-tac-toe-web:${{ github.sha }}"
